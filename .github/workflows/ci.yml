name: CI

# Lint and typecheck on every push; the integration suite needs services, so it
# runs in its own job with Postgres and Redis alongside.
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main, develop] }

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: snapx
        ports: ['5432:5432']
        # Without this the job races the container and fails on the first query.
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/snapx
      REDIS_URL: redis://localhost:6379
      # Test-only values. Real secrets come from repository secrets in deploy.
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210fedcba98765432
      WEB_ORIGIN: http://localhost:3000
      STORAGE_DIR: ./storage

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run db:reset
      - run: npm --prefix apps/api run build
      - name: Start API and run the suite
        run: |
          node apps/api/dist/main.js &
          for i in $(seq 1 30); do
            curl -s -o /dev/null localhost:4000/api/auth/me && break
            sleep 1
          done
          npm --prefix apps/api test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run build
