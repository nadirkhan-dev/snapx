# SNAPX reverse proxy — TLS for both the web app and the API.
#
# WebRTC and getUserMedia refuse to run on insecure origins, so HTTPS is not
# optional here even for testing on a phone.

server {
    listen 80;
    server_name <YOUR_DOMAIN> api.<YOUR_DOMAIN>;
    return 301 https://$host$request_uri;
}

# --- web app (Next.js) ---
server {
    listen 443 ssl http2;
    server_name <YOUR_DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API + WebSocket signalling ---
server {
    listen 443 ssl http2;
    server_name api.<YOUR_DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/api.<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.<YOUR_DOMAIN>/privkey.pem;

    client_max_body_size 90M;     # video snaps are capped at 80MB

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The socket.io upgrade. Without these three headers the handshake falls
    # back to long-polling forever and signalling is slow but not obviously
    # broken — the worst kind of misconfiguration.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A call can sit idle between signalling messages; the default 60s
        # timeout would drop the socket mid-call.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
