# coturn configuration for SNAPX
#
# Install:  apt install coturn
# Enable:   sed -i 's/#TURNSERVER_ENABLED/TURNSERVER_ENABLED/' /etc/default/coturn
# Config:   copy this to /etc/turnserver.conf, then: systemctl restart coturn

listening-port=3478
tls-listening-port=5349

# Both are required on a cloud VM: the box sees its private address, but
# candidates must advertise the public one or nothing can reach it.
listening-ip=0.0.0.0
external-ip=<PUBLIC_IP>
relay-ip=<PRIVATE_IP>

realm=turn.<YOUR_DOMAIN>
server-name=turn.<YOUR_DOMAIN>

# Ephemeral credentials. `static-auth-secret` must equal TURN_SECRET in the
# API's environment — coturn recomputes the same HMAC the API generated, so no
# user accounts are provisioned here at all.
use-auth-secret
static-auth-secret=<TURN_SECRET>

# TLS for turns:. Reuse the Let's Encrypt certificate for your domain.
cert=/etc/letsencrypt/live/turn.<YOUR_DOMAIN>/fullchain.pem
pkey=/etc/letsencrypt/live/turn.<YOUR_DOMAIN>/privkey.pem

# Relay range. Every one of these UDP ports must be open in the firewall or
# calls that need TURN fail with no useful error.
min-port=49160
max-port=49200

# Refuse to relay to private ranges — an open TURN server is an open proxy that
# will be found and abused within days.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
no-multicast-peers

user-quota=12
total-quota=1200
no-cli
fingerprint
